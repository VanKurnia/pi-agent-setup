<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Review</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20800%22%3E%0A%20%20%3Crect%20width%3D%22800%22%20height%3D%22800%22%20rx%3D%22120%22%20fill%3D%22%2309090b%22%2F%3E%0A%20%20%3Cpath%20fill%3D%22%23fff%22%20fill-rule%3D%22evenodd%22%20d%3D%22%0A%20%20%20%20M165.29%20165.29%0A%20%20%20%20H517.36%0A%20%20%20%20V400%0A%20%20%20%20H400%0A%20%20%20%20V517.36%0A%20%20%20%20H282.65%0A%20%20%20%20V634.72%0A%20%20%20%20H165.29%0A%20%20%20%20Z%0A%20%20%20%20M282.65%20282.65%0A%20%20%20%20V400%0A%20%20%20%20H400%0A%20%20%20%20V282.65%0A%20%20%20%20Z%0A%22%2F%3E%0A%20%20%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M517.36%20400%20H634.72%20V634.72%20H517.36%20Z%22%2F%3E%0A%3C%2Fsvg%3E">
<link rel="stylesheet" href="/page.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css">
</head>
<body>
<div class="status-bar" role="status" aria-label="Plan status">
  <span class="dot connected" id="statusDot"></span>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
  <span id="connStatus">Connected</span>
  <span class="status-divider"></span>
  <span class="status-badge" id="statusBadge">Pending</span>
  <span style="flex:1"></span>
  <button class="status-btn accept" id="acceptBtn" aria-label="Accept plan"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Accept</button>
  <button class="status-btn reject" id="rejectBtn" aria-label="Request changes"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Request</button>
</div>
<div class="main-card">
  <h1>Plan Review</h1>
  <div class="summary" id="summary"></div>
  <div id="content">
    <div class="skeleton" aria-label="Loading plan…">
      <div class="skeleton-line" style="width:60%"></div>
      <div class="skeleton-line" style="width:90%"></div>
      <div class="skeleton-line" style="width:75%"></div>
      <div class="skeleton-line" style="width:40%"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="alert" aria-live="polite"></div>
<div class="modal-overlay" id="commentModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <h3 id="modalTitle">Add Comment</h3>
    <textarea id="modalText" placeholder="Type your comment…"></textarea>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="cancelBtn">Cancel</button>
      <button class="modal-btn primary" id="submitBtn">Submit</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  window.mermaid = mermaid;
  mermaid.initialize({ startOnLoad: false, theme: "dark" });
</script>
<script src="/page.js"></script>
</body>
</html>
